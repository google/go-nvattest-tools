name: Fuzz
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./abi
            target: FuzzRawAttestationReportToProto
          - pkg: ./abi
            target: FuzzParseMeasurementRecord
          - pkg: ./abi
            target: FuzzParseOpaqueData
          - pkg: ./server/verify
            target: FuzzParsePEMCertificateChain
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install libxml2 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
      - name: Run Go Fuzz (${{ matrix.target }})
        env:
          CGO_ENABLED: 1
        run: go test ${{ matrix.pkg }} -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s -fuzzminimizetime=5s
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/**'
          if-no-files-found: ignore
